% HANSEL_MESH IWRL6432BOOST low-latency operator-view profile
%
% Target firmware:
%   MMWAVE-L-SDK 05.05.04.02
%   motion_and_presence_detection_demo.release.appimage (Presence_Demo)
%   xwrL64xx-evm / IWRL6432BOOST
%
% Reset the board before applying this file.  This low-power profile does not
% support a reliable sensorStop, so sensorStop is intentionally omitted.
%
% This is the preferred teleoperation profile:
%   128 range bins x 16 azimuth bins x 4 bytes x 10 Hz ~= 81.9 kB/s.
% It carries the same heatmap bytes/second as the 32-bin/5-Hz fallback, but a
% packet is roughly half as large, reducing UART serialization latency.  The
% six-channel physical aperture does not gain true angular resolution merely
% by zero-padding the angle FFT from 16 to 32 bins.

channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 8 600 16 100 0

% pointCloud=2 (compressed), rangeProfile=0, rangeAzimuthHeatMap=1 (major),
% statsInfo=1.  Heatmap dimensions are 128 range x 16 azimuth.
guiMonitor 2 0 0 1 0 1 0 0 0 0 0

sigProcChainCfg 16 4 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.25 7.5

% Preserve zero-Doppler returns from walls and rubble for obstacle viewing.
clutterRemoval 0

% Uncalibrated baseline.  Replace this only after a measured range/phase
% calibration; decimals do not imply sub-bin accuracy.
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 1

% Do not write factory calibration data to flash during prototype runs.
factoryCalibCfg 0 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
mpdBoundaryBox 1 -3.5 0 0 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2

% The CLI UART is reopened at the new baud.  The host must wait for
% "Done" and the next prompt at 1,250,000 before sending sensorStart.
baudRate 1250000
sensorStart 0 0 0 0
