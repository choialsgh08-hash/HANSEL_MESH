% HANSEL_MESH IWRL6432BOOST high-bandwidth near-wall operator profile
%
% Target firmware:
%   MMWAVE-L-SDK 05.05.04.02
%   motion_and_presence_detection_demo.release.appimage (Presence_Demo)
%   xwrL64xx-evm / IWRL6432BOOST
%
% Bench evidence on 2026-08-11 showed that the former 75 MHz/us slope
% produced only 2-3 native rows across a 23-30 cm wall. 125 MHz/us reduces
% the native range-bin spacing from 0.09765625 m to 0.05859375 m while the
% 23 us ramp ends at 63.375 GHz, inside the device band. The verified 16-bin
% azimuth FFT is retained: 32/64-bin trials produced no UART frames with the
% current elevation-8 presence chain. CFAR 10 dB added no stable wall return,
% so the lower-noise 12 dB setting is retained.

channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 125 60.5
frameCfg 2 8 600 16 125 0

guiMonitor 2 0 0 1 0 1 0 0 0 0 0
sigProcChainCfg 16 8 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 12 0 0.5 0 1 1 1
aoaFovCfg -60 60 -40 40
rangeSelCfg 0.07 7.5

clutterRemoval 0
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 0

factoryCalibCfg 0 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 0.065 0 0
mpdBoundaryBox 1 -3.5 0 0.07 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0.07 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2

baudRate 1250000
sensorStart 0 0 0 0
