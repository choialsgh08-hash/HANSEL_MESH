% HANSEL_MESH IWRL6432BOOST near-range 3D operator-view profile
%
% Target firmware:
%   MMWAVE-L-SDK 05.05.04.02
%   motion_and_presence_detection_demo.release.appimage (Presence_Demo)
%   xwrL64xx-evm / IWRL6432BOOST
%
% This keeps the validated 128x16 heatmap, 10 Hz frame rate, elevation FFT 8,
% and CFAR threshold 15 dB. Only the range-selection minimum changes from
% 0.25 m to 0.07 m, matching the near-range value used by TI's bundled
% xWRL64xx motion/presence CLI example. The 0.09765625 m range-bin spacing
% means the first useful displayed cell is approximately 0.10 m. Very close
% bins can contain TX/RX leakage and must be bench-tested before driving.

channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 8 600 16 100 0

guiMonitor 2 0 0 1 0 1 0 0 0 0 0
sigProcChainCfg 16 8 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.07 7.5

clutterRemoval 0
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 1

factoryCalibCfg 0 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
mpdBoundaryBox 1 -3.5 0 0.07 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0.07 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2

baudRate 1250000
sensorStart 0 0 0 0
