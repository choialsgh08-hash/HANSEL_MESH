% IWRL6432BOOST cable-free near-wall driving aid: 16 azimuth x 4 elevation
% bins at 5 Hz.  This measured UART-safe shape leaves room for both the full
% range-azimuth heatmap and the final two chirps' ADC samples every frame.
channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 125 60.5
frameCfg 2 8 600 16 200 0

% Keep the full range-azimuth heatmap and additionally stream the final
% two chirps' REAL16 ADC samples over UART for PC-side range processing.
guiMonitor 2 0 0 1 0 1 0 1 0 0 0
sigProcChainCfg 16 4 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 12 0 0.5 0 1 1 1
aoaFovCfg -60 60 -40 40
rangeSelCfg 0.07 7.5

clutterRemoval 0
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 0

factoryCalibCfg 0 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 0.065 0 0
mpdBoundaryBox 1 -3.5 0 0.07 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0.07 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2

baudRate 1250000
sensorStart 0 0 0 0
