% HANSEL_MESH IWRL6432BOOST experimental 3D operator-view profile
%
% Target firmware:
%   MMWAVE-L-SDK 05.05.04.02
%   motion_and_presence_detection_demo.release.appimage (Presence_Demo)
%   xwrL64xx-evm / IWRL6432BOOST
%
% Reset the board before applying this file. This profile keeps the 128x16
% range-azimuth heatmap at 10 Hz and increases the elevation FFT from 4 to 8.
% The larger FFT produces a finer elevation sampling grid for point-cloud z,
% but does not improve the board's physical elevation resolution (~58 deg).
% The proven 15 dB CFAR threshold is retained so elevation sampling is the only
% experimental variable. Validate this profile before robot driving.

channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 8 600 16 100 0

% pointCloud=2 (compressed), rangeAzimuthHeatMap=1 (major), statsInfo=1.
guiMonitor 2 0 0 1 0 1 0 0 0 0 0

% azimuth FFT 16, elevation FFT 8, major-motion processing.
sigProcChainCfg 16 8 1 2 8 4 0 0.3 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.25 7.5

clutterRemoval 0
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 1

factoryCalibCfg 0 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
mpdBoundaryBox 1 -3.5 0 0 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
majorStateCfg 5 4 20 15 12 40 4 20
clusterCfg 1 1 2

baudRate 1250000
sensorStart 0 0 0 0
