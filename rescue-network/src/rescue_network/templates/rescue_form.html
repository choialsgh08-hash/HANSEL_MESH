<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>구조 요청 — Rescue Network</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>🆘 구조 요청</h1>
      <p class="sub">아래 정보를 입력한 뒤 <strong>구조 요청 보내기</strong>를 누르세요.</p>
    </header>

    <form id="rescue-form" novalidate>
      <div class="field">
        <label for="people_count">인원 수 <span class="req" aria-hidden="true">*</span></label>
        <input
          type="number" id="people_count" name="people_count"
          inputmode="numeric" min="1" max="1000" value="1" required
          aria-describedby="people_count-help" />
        <small id="people_count-help" class="help">현재 위치의 총 인원 수</small>
      </div>

      <fieldset class="field">
        <legend>부상 여부 <span class="req" aria-hidden="true">*</span></legend>
        <div class="radios" role="radiogroup" aria-label="부상 여부">
          <label class="radio"><input type="radio" name="injury_status" value="yes" /> 부상 있음</label>
          <label class="radio"><input type="radio" name="injury_status" value="no" /> 부상 없음</label>
          <label class="radio"><input type="radio" name="injury_status" value="unknown" checked /> 모름</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="condition">현재 상태 <span class="req" aria-hidden="true">*</span></label>
        <input
          type="text" id="condition" name="condition" maxlength="500" required
          placeholder="예: 건물 3층에 고립됨, 움직이기 어려움"
          aria-describedby="condition-help" />
        <small id="condition-help" class="help">지금 처한 상황을 한 줄로</small>
      </div>

      <div class="field">
        <label for="message">구조 요청 메시지 <span class="req" aria-hidden="true">*</span></label>
        <textarea
          id="message" name="message" rows="4" maxlength="2000" required
          placeholder="구조대에게 전달할 내용을 자세히 적어주세요."></textarea>
      </div>

      <div class="field">
        <label for="location_text">위치 정보</label>
        <textarea
          id="location_text" name="location_text" rows="2" maxlength="500"
          placeholder="예: OO아파트 101동 근처, 파란 지붕 건물 옆"
          aria-describedby="location-help"></textarea>
        <small id="location-help" class="help">주변 지형지물 등으로 현재 위치를 설명해주세요.</small>
      </div>

      <button type="submit" id="submit-btn" class="btn">구조 요청 보내기</button>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </form>

    <footer class="foot">노드: <code>{{ node_id }}</code></footer>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
