<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구조대 대시보드 — Rescue Network</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="dashboard">
  <main class="wrap-wide">
    <header class="hero">
      <h1>🚑 구조대 대시보드</h1>
      <p class="sub">
        수신 노드: <code>{{ node_id }}</code>
        · 총 <span id="count" aria-live="polite">0</span>건
        · <span id="updated" class="muted">갱신 대기 중…</span>
      </p>
    </header>

    <div id="error" class="status err" role="alert" hidden></div>

    <div class="table-scroll">
      <table id="requests">
        <thead>
          <tr>
            <th scope="col">수신 시간</th>
            <th scope="col">요청 ID</th>
            <th scope="col">출발 노드</th>
            <th scope="col">인원</th>
            <th scope="col">부상</th>
            <th scope="col">상태</th>
            <th scope="col">메시지</th>
            <th scope="col">위치</th>
            <th scope="col">최초 생성</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr id="empty-row"><td colspan="9" class="empty">수신된 구조 요청이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
