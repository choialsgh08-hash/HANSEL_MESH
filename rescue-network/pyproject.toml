[project]
name = "rescue-network"
version = "0.1.0"
description = "Disaster rescue-request mesh network (field / relay / receiver nodes)"
readme = "README.md"
# Spec targets Python 3.11+. The reference dev box only ships 3.10, so we keep
# >=3.10 to stay runnable while the code stays 3.10-compatible.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rescue_network = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008: FastAPI's `Depends()` in argument defaults is the intended idiom.
ignore = ["B008"]
